name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore ZeroAlloc.Json.sln --locked-mode
      - run: dotnet build ZeroAlloc.Json.sln -c Release --no-restore
      - run: dotnet test tests/ZeroAlloc.Json.Tests -c Release --no-build
      - run: dotnet run -c Release --no-build --project samples/ZeroAlloc.Json.Demo
      - name: Exercise every benchmark case
        run: dotnet run -c Release --no-build --project benchmarks/ZeroAlloc.Json.Benchmarks -- --filter '*' --job dry
      - name: Validate split and retained evidence
        run: python scripts/verify-evidence.py
