name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: scope
        run: python scripts/ci_changes.py
      - name: Check CI routing and documentation validation
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Validate documentation and retained evidence
        run: python scripts/verify-docs.py
  verify:
    needs: documentation
    if: ${{ needs.documentation.outputs.full == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore ZeroAlloc.Json.sln --locked-mode
      - run: dotnet build ZeroAlloc.Json.sln -c Release --no-restore
      - run: dotnet test tests/ZeroAlloc.Json.Tests -c Release --no-build
      - run: dotnet run -c Release --no-build --project samples/ZeroAlloc.Json.Demo
      - name: Exercise every benchmark case
        run: dotnet run -c Release --no-build --project benchmarks/ZeroAlloc.Json.Benchmarks -- --filter '*' --job dry
