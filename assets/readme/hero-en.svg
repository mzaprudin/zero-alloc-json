<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Zero-Alloc JSON — JSON for low-latency systems</title>
  <desc id="desc">Zero-Alloc JSON processes continuous data streams in C# / .NET 10. JSON braces inside a triangular recycling ribbon represent reusing the same object and buffers. The three folded arrows keep their original proportions.</desc>
  <rect width="1200" height="400" rx="16" fill="#15231f"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="64" y="58" fill="#acbfb5" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="23">C# / .NET 10</text>
    <g id="identity" font-size="104" font-weight="700" letter-spacing="-3">
      <text x="58" y="170" fill="#f4f5ed">Zero-Alloc</text>
      <text x="58" y="274" fill="#a6efc3">JSON</text>
    </g>
    <g id="reused-json-object">
      <!-- Recycling geometry adapted from Wikimedia Commons, Recycling_symbol2.svg (public domain): https://commons.wikimedia.org/wiki/File:Recycling_symbol2.svg -->
      <g id="recycling-arrows" transform="translate(820 48) scale(0.448)">
        <g id="ribbon-arrow-one">
          <path fill="#6fa98a" d="M17 377l82 152c17 21 48 26 80 25h87v-144l-165-1c-26 2-59-4-85-32z"/>
          <path fill="#a6efc3" d="M10 207l38 30-36 69c-18 32 13 63 33 74 19 11 50 12 78 12l51-83 38 21-66-123-135 1z"/>
        </g>
        <g id="ribbon-arrow-two">
          <path fill="#6fa98a" d="M382 20l-173-2c-26 4-46 29-61 58l-42 76 126 70 81-143c11-23 32-50 69-58z"/>
          <path fill="#a6efc3" d="M533 97l-45 19-43-65c-19-31-61-19-80-7-19 12-34 38-48 62l48 85-37 23 140 2 65-119z"/>
        </g>
        <g id="ribbon-arrow-three">
          <path fill="#6fa98a" d="M530.84 513.925l85-150c9-25-3-54-21-81l-46-74-122 76 86 140c15 21 28 52 17 89z"/>
          <path fill="#a6efc3" d="M390 607l5-48 78-6c37-2 46-44 45-67-1-22-16-48-31-72l-97.16.925-3-43-69 122 73 114z"/>
        </g>
      </g>
      <rect x="922" y="164" width="76" height="48" rx="7" fill="#a6efc3" fill-opacity="0.06" stroke="#a6efc3" stroke-opacity="0.4"/>
      <g fill="#a6efc3" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="36">
        <text x="925" y="201">{</text>
        <text x="974" y="201">}</text>
      </g>
      <g fill="#a6efc3">
        <rect x="949" y="175" width="16" height="3" rx="1.5" opacity="0.45"/>
        <rect x="949" y="185" width="10" height="3" rx="1.5"/>
        <rect x="949" y="195" width="14" height="3" rx="1.5" opacity="0.45"/>
      </g>
    </g>
    <text x="64" y="350" fill="#f4f5ed" font-size="42" letter-spacing="-0.5">JSON for low-latency systems</text>
  </g>
</svg>
